name = "hash-wallet-prices"
main = "src/index.ts"
compatibility_date = "2026-05-14"
workers_dev = true

# KV namespace for cached prices.
# Run `wrangler kv:namespace create PRICES` once, then paste the returned id below.
# (The script also works without KV — it falls back to fetching upstream on each request.)
[[kv_namespaces]]
binding = "PRICES"
id = "ccd6f69c03f14d9b8317eeaed2bf9f23"

# Market history (neroswap.com/markets, charts). Created 2026-10-25 with
# `npx wrangler d1 create neroswap-prices`; apply new migrations with
#   npx wrangler d1 migrations apply neroswap-prices --remote
# The code reads the binding as env.HISTORY. Without it the spot feed works as
# before and the history endpoints answer 503. Usage stays inside the Workers
# Paid plan's included D1 quota: about 6,000 rows written a day against 50
# million a month included.
[[d1_databases]]
binding = "HISTORY"
database_name = "neroswap-prices"
database_id = "3c5f2e56-2fd9-414e-a5c0-dc2f10b1a6c2"
migrations_dir = "migrations"

# Run the refresh every 60 seconds.
# Cloudflare cron triggers fire once per minute at minimum.
[triggers]
crons = ["* * * * *"]

# Custom domain. Will be auto-bound to neroswap.com's DNS zone via the
# Cloudflare Workers UI when you "Add Custom Domain" — you do NOT create a
# CNAME manually for this.
[[routes]]
pattern = "prices.neroswap.com"
custom_domain = true
